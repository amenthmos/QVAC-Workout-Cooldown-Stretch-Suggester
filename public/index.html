<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>QVAC Workout Cooldown Stretch Suggester</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: #f2f7f6;
    font-family: 'Segoe UI', system-ui, sans-serif;
    color: #1c2b28;
    display: flex;
    justify-content: center;
    padding: 48px 20px;
  }
  .wrap { width: 100%; max-width: 560px; }
  .card {
    background: #fff;
    border-radius: 14px;
    box-shadow: 0 2px 14px rgba(10,50,40,0.08);
    padding: 34px 36px;
  }
  .brand { font-size: 0.7rem; letter-spacing: 3px; text-transform: uppercase; color: #0e9e8a; font-weight: 700; margin-bottom: 6px; }
  h1 { font-size: 1.5rem; margin: 0 0 6px; color: #142a26; font-weight: 800; }
  .subtitle { color: #5a726c; font-size: 0.9rem; margin-bottom: 26px; }
  .field-label { font-size: 0.78rem; color: #5a726c; margin-bottom: 6px; font-weight: 600; }
  input[type=text] {
    width: 100%;
    padding: 11px 12px;
    border-radius: 8px;
    border: 1px solid #c8dfda;
    background: #fbfefd;
    color: #1c2b28;
    font-family: inherit;
    font-size: 0.95rem;
    margin-bottom: 16px;
  }
  input[type=text]:focus { outline: none; border-color: #0e9e8a; }
  button.action {
    padding: 11px 24px;
    border: none;
    border-radius: 8px;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
    background: #0e9e8a;
    color: #fff;
  }
  button.action:hover:not(:disabled) { background: #0b7c6c; }
  button.action:disabled { opacity: 0.4; cursor: not-allowed; }
  .status { margin-top: 14px; font-size: 0.85rem; color: #7c948d; min-height: 1.2em; }
  .result-list { margin-top: 22px; list-style: none; padding: 0; counter-reset: xnum; }
  .result-list li {
    counter-increment: xnum;
    padding: 14px 16px 14px 40px;
    position: relative;
    background: #eaf7f4;
    border-left: 3px solid #0e9e8a;
    border-radius: 6px;
    margin-bottom: 10px;
    font-size: 0.98rem;
    line-height: 1.5;
    color: #1c2b28;
  }
  .result-list li::before {
    content: counter(xnum);
    position: absolute;
    left: 12px;
    top: 14px;
    font-weight: 800;
    color: #0e9e8a;
    font-size: 0.85rem;
  }
  .footer-note { color: #7c948d; font-size: 0.78rem; text-align: center; margin-top: 22px; }
  .spinner {
    display: inline-block;
    width: 12px; height: 12px;
    border: 2px solid #d6ece7;
    border-top-color: #0e9e8a;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    vertical-align: middle;
    margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="brand">On-Device Cooldown Coach</div>
      <h1>Workout Cooldown Stretch Suggester</h1>
      <p class="subtitle">Enter the workout you just finished, get 3-4 relevant cooldown stretches.</p>

      <div class="field-label">WORKOUT TYPE</div>
      <input type="text" id="workoutInput" placeholder="e.g. running, upper body lifting, yoga" />
      <button class="action" id="generateBtn">Get Stretches</button>
      <div class="status" id="status"></div>
      <ul class="result-list" id="resultList"></ul>
    </div>

    <p class="footer-note">Everything runs locally on your machine. No text ever leaves this device.</p>
  </div>

  <script>
    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    const workoutInput = document.getElementById('workoutInput');
    const generateBtn = document.getElementById('generateBtn');
    const status = document.getElementById('status');
    const resultList = document.getElementById('resultList');

    async function generate() {
      const workoutType = workoutInput.value.trim();
      if (!workoutType) return;
      generateBtn.disabled = true;
      resultList.innerHTML = '';
      status.innerHTML = '<span class="spinner"></span>Finding your stretches...';

      try {
        const res = await fetch('/api/cooldown', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ workoutType }),
        });
        const data = await res.json();
        if (data.error) throw new Error(data.error);

        status.textContent = '';
        resultList.innerHTML = data.stretches.map(s => `<li>${escapeHtml(s)}</li>`).join('');
      } catch (err) {
        status.textContent = 'Error: ' + err.message;
      } finally {
        generateBtn.disabled = false;
      }
    }

    generateBtn.addEventListener('click', generate);
    workoutInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') generate(); });
  </script>
</body>
</html>
